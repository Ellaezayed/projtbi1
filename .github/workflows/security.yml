name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Scan tracked files and history
        run: python scripts/check_public_repo.py
      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --no-deps --disable-pip -r backend/requirements.txt
          npm --prefix frontend audit --package-lock-only
      - name: Test FastAPI
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip check
          python -m unittest discover -s backend -v
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
